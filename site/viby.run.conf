server {
    listen 80;
    listen [::]:80;
    server_name viby.run www.viby.run;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://viby.run$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.viby.run;
    http2 on;

    ssl_certificate /www/sites/viby.run/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/viby.run/ssl/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    return 301 https://viby.run$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name viby.run;
    http2 on;

    access_log /www/sites/viby.run/log/access.log main;
    error_log /www/sites/viby.run/log/error.log;

    ssl_certificate /www/sites/viby.run/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/viby.run/ssl/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    root /www/sites/viby.run/dist;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /usr/share/nginx/html;
    }

    # static assets: long cache, immutable name hashes optional
    location /assets/ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # html: no-cache so deploys take effect immediately
    location = / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files /index.html =404;
    }

    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}

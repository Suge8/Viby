name: Desktop Release

on:
  push:
    tags:
      - 'desktop-v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Semver version to release, without leading v
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-desktop:
    name: Build Desktop (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            runner: macos-15
            bundles: app,dmg
          - label: macOS Intel
            runner: macos-15-intel
            bundles: app,dmg
          - label: Linux x64
            runner: ubuntu-22.04
            bundles: appimage
          - label: Windows x64
            runner: windows-latest
            bundles: nsis

    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux desktop dependencies
        if: matrix.runner == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf

      - name: Verify signing secrets
        shell: bash
        run: |
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]]; then
            echo "Missing TAURI_SIGNING_PRIVATE_KEY secret"
            exit 1
          fi

          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}" ]]; then
            echo "Missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD secret"
            exit 1
          fi

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#desktop-v}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved desktop version: ${VERSION}"

      - name: Verify desktop version
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -p "require('./desktop/package.json').version")
          TAURI_VERSION=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")

          if [[ "${PACKAGE_VERSION}" != "${{ steps.version.outputs.version }}" ]]; then
            echo "desktop/package.json version ${PACKAGE_VERSION} does not match release version ${{ steps.version.outputs.version }}"
            exit 1
          fi

          if [[ "${TAURI_VERSION}" != "${{ steps.version.outputs.version }}" ]]; then
            echo "desktop/src-tauri/tauri.conf.json version ${TAURI_VERSION} does not match release version ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Install dependencies
        shell: bash
        run: bun install --frozen-lockfile

      - name: Build AppCore
        shell: bash
        run: |
          bun run build:app-core
          bun run --cwd desktop prepare:app-core

      - name: Build and upload desktop release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tauriScript: bun tauri
          tagName: desktop-v__VERSION__
          releaseName: Viby Desktop v__VERSION__
          releaseBody: |
            Desktop release for Viby.

            Viby ships as one Desktop App. No npm or CLI install path is published.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --bundles ${{ matrix.bundles }}

<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
        />

        <!-- PWA Meta Tags -->
        <meta name="theme-color" content="#fbfaf6" />
        <meta name="description" content="AI-powered development assistant" />

        <!-- iOS PWA Meta Tags -->
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="Viby" />
        <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

        <!-- Favicon -->
        <link rel="icon" href="/favicon.ico" sizes="48x48" />
        <link rel="icon" href="/icon.svg" sizes="any" type="image/svg+xml" />

        <!-- Safari Pinned Tab -->
        <link rel="mask-icon" href="/mask-icon.svg" color="#ff8d5d" />

        <!-- Prevent flash of white background on dark mode -->
        <style>
            html {
                --app-font-scale: 0.9;
                background: #fff;
                font-family: system-ui, -apple-system, BlinkMacSystemFont, "Avenir Next", "SF Pro Display", "Segoe UI Variable Text", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
                font-size: calc(100% * var(--app-font-scale, 0.9));
            }

            body {
                margin: 0;
                font-family: system-ui, -apple-system, BlinkMacSystemFont, "Avenir Next", "SF Pro Display", "Segoe UI Variable Text", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
                -webkit-font-smoothing: antialiased;
                text-rendering: optimizeLegibility;
                font-synthesis-weight: none;
            }

            @media (prefers-color-scheme: dark) {
                html { background: #1c1c1e; color-scheme: dark }
            }

            #app-boot-shell {
                position: fixed;
                inset: 0;
                z-index: 60;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 1.25rem;
                background: #fbfaf6;
                opacity: 1;
                transition: opacity 0.2s ease;
            }

            @media (prefers-color-scheme: dark) {
                #app-boot-shell {
                    background: #1c1c1e;
                }
            }

            #app-boot-shell.is-hidden {
                opacity: 0;
                pointer-events: none;
            }

            html[data-boot-shell-hidden="true"] #app-boot-shell {
                opacity: 0;
                pointer-events: none;
            }

            .boot-shell-stage {
                width: min(100%, 22rem);
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 1.5rem;
                text-align: center;
            }

            .boot-shell-mark-stage {
                position: relative;
                width: 5rem;
                height: 5rem;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                filter: drop-shadow(0 0.75rem 1.75rem rgba(15, 23, 42, 0.1));
            }

            .boot-shell-mark {
                width: 3.4rem;
                height: 3.4rem;
                display: inline-block;
                background-color: #171717;
                -webkit-mask-image: url('/brand-logo-tight.png');
                mask-image: url('/brand-logo-tight.png');
                -webkit-mask-position: center;
                mask-position: center;
                -webkit-mask-repeat: no-repeat;
                mask-repeat: no-repeat;
                -webkit-mask-size: contain;
                mask-size: contain;
            }

            .boot-shell-title {
                margin: 0;
                font-size: clamp(1.4rem, 6.6vw, 1.65rem);
                font-weight: 700;
                line-height: 1.18;
                color: #171717;
                letter-spacing: 0;
            }

            .boot-shell-title:empty {
                display: none;
            }

            .boot-shell-rail {
                position: relative;
                width: min(100%, 13rem);
                height: 0.4rem;
                overflow: hidden;
                border-radius: 999px;
                background: rgba(23, 23, 23, 0.07);
                box-shadow: inset 0 0 0 1px rgba(23, 23, 23, 0.04);
            }

            .boot-shell-rail-fill {
                position: absolute;
                inset: 0;
                width: 8%;
                border-radius: inherit;
                background: linear-gradient(
                    90deg,
                    rgba(23, 23, 23, 0.7),
                    rgba(23, 23, 23, 1),
                    rgba(23, 23, 23, 0.85)
                );
                transition: width 520ms cubic-bezier(0.16, 1, 0.3, 1);
            }

            .boot-shell-rail-fill::after {
                content: '';
                position: absolute;
                inset: 0;
                border-radius: inherit;
                background: linear-gradient(
                    90deg,
                    transparent 0%,
                    rgba(255, 255, 255, 0.55) 50%,
                    transparent 100%
                );
                transform: translateX(-120%);
                animation: boot-shell-sheen 1.6s ease-in-out infinite;
            }

            @media (prefers-color-scheme: dark) {
                .boot-shell-mark { background-color: #fafafa }
                .boot-shell-title { color: #fafafc }
                .boot-shell-rail {
                    background: rgba(250, 250, 250, 0.08);
                    box-shadow: inset 0 0 0 1px rgba(250, 250, 250, 0.05);
                }
                .boot-shell-rail-fill {
                    background: linear-gradient(
                        90deg,
                        rgba(250, 250, 250, 0.75),
                        rgba(250, 250, 250, 1),
                        rgba(250, 250, 250, 0.88)
                    );
                }
            }

            @keyframes boot-shell-sheen {
                0% { transform: translateX(-120%) }
                65%, 100% { transform: translateX(220%) }
            }

            @media (prefers-reduced-motion: reduce) {
                #app-boot-shell,
                .boot-shell-rail-fill,
                .boot-shell-rail-fill::after {
                    animation: none;
                    transition: none;
                }
                .boot-shell-rail-fill {
                    width: 8%;
                }
            }
        </style>
        <script>
            (function () {
                try {
                    var raw = localStorage.getItem('viby-font-scale')
                    var scale = Number(raw)
                    if (scale === 0.8 || scale === 0.9 || scale === 1 || scale === 1.1 || scale === 1.2) {
                        document.documentElement.style.setProperty('--app-font-scale', String(scale))
                    }
                } catch (error) {
                    // Ignore storage errors.
                }
            })()
        </script>
        <script>
            ;(function () {
                var preference = 'system'
                try {
                    preference = localStorage.getItem('viby-appearance') || 'system'
                } catch (error) {
                    // Ignore storage errors.
                }

                var dark =
                    preference === 'dark' ||
                    (preference !== 'light' &&
                        window.matchMedia &&
                        window.matchMedia('(prefers-color-scheme: dark)').matches)
                var scheme = dark ? 'dark' : 'light'
                var themeColor = dark ? '#1c1c1e' : '#fbfaf6'
                var themeMeta = document.querySelector('meta[name="theme-color"]')

                document.documentElement.setAttribute('data-theme', scheme)
                if (themeMeta) {
                    themeMeta.setAttribute('content', themeColor)
                    themeMeta.removeAttribute('media')
                }
            })()
        </script>
        <script>
            (function () {
                var RECOVERY_KEY = 'viby-pending-app-recovery'
                var BOOT_RECOVERY_SURFACE_OWNER_KEY = 'viby-boot-recovery-surface-owner'
                var APP_SHELL_REVEALED_KEY = 'viby-app-shell-revealed'

                function hasSearchParam(name, value) {
                    var targetName = name.toLowerCase()
                    var params = new URLSearchParams(window.location.search)
                    for (var entry of params.entries()) {
                        if (entry[0].toLowerCase() === targetName && entry[1] === value) {
                            return true
                        }
                    }
                    return false
                }

                function isPairingBootRoute() {
                    return window.location.pathname.indexOf('/p/') === 0
                        || hasSearchParam('remote', '1')
                }

                try {
                    if (document.wasDiscarded) {
                        sessionStorage.setItem(RECOVERY_KEY, JSON.stringify({
                            reason: 'page-discarded',
                            at: Date.now()
                        }))
                    }

                    if (isPairingBootRoute()) {
                        document.documentElement.setAttribute('data-boot-pairing', 'true')
                    } else if (sessionStorage.getItem(APP_SHELL_REVEALED_KEY) === 'done') {
                        document.documentElement.setAttribute('data-boot-shell-hidden', 'true')
                    }

                    if (document.wasDiscarded || sessionStorage.getItem(RECOVERY_KEY)) {
                        document.documentElement.setAttribute('data-boot-mode', 'recovery')
                        sessionStorage.setItem(BOOT_RECOVERY_SURFACE_OWNER_KEY, 'boot-shell')
                    }
                } catch (error) {
                    // Ignore storage errors.
                }
            })()
        </script>
        <script>
            (function () {
                var IS_VITE_DEV = '%MODE%' === 'development'
                var RECOVERY_KEY = 'viby-runtime-asset-recovery'
                var APP_RECOVERY_KEY = 'viby-pending-app-recovery'
                var APP_SHELL_REVEALED_KEY = 'viby-app-shell-revealed'
                var RUNTIME_UPDATE_READY_EVENT = 'viby:runtime-update-ready'
                var RUNTIME_UPDATE_STORAGE_KEY = 'viby-runtime-update-ready'
                var ERROR_PATTERNS = [
                    'failed to fetch dynamically imported module',
                    'importing a module script failed',
                    'loading module from',
                    'dynamically imported module'
                ]

                if (IS_VITE_DEV) {
                    return
                }

                function normalize(value) {
                    return typeof value === 'string' ? value.trim().toLowerCase() : ''
                }

                function containsAssetPath(value) {
                    return value.indexOf('/assets/') !== -1
                }

                function hasKnownLoadFailure(values) {
                    return values.some(function (value) {
                        return ERROR_PATTERNS.some(function (pattern) {
                            return value.indexOf(pattern) !== -1
                        })
                    })
                }

                function isLikelyAssetFailure(details) {
                    var filename = normalize(details && details.filename)
                    var message = normalize(details && details.message)
                    var stack = normalize(details && details.stack)

                    return hasKnownLoadFailure([message, stack])
                        || (containsAssetPath(filename) && hasKnownLoadFailure([message]))
                }

                async function clearRuntimeAssets() {
                    if ('serviceWorker' in navigator) {
                        var registrations = await navigator.serviceWorker.getRegistrations()
                        await Promise.all(registrations.map(function (registration) {
                            return registration.unregister()
                        }))
                    }

                    if ('caches' in window) {
                        var cacheKeys = await caches.keys()
                        await Promise.all(cacheKeys.map(function (cacheKey) {
                            return caches.delete(cacheKey)
                        }))
                    }
                }

                async function recoverRuntimeAssets(reason) {
                    try {
                        if (sessionStorage.getItem(RECOVERY_KEY) === reason) {
                            return
                        }
                        sessionStorage.setItem(RECOVERY_KEY, reason)
                        await clearRuntimeAssets()

                        if (sessionStorage.getItem(APP_SHELL_REVEALED_KEY) === 'done') {
                            var snapshot = {
                                availableAt: Date.now(),
                                mode: 'reload',
                                recoveryReason: 'runtime-asset-reload',
                                resumeHref: window.location.pathname + window.location.search + window.location.hash
                            }
                            sessionStorage.setItem(RUNTIME_UPDATE_STORAGE_KEY, JSON.stringify(snapshot))
                            window.dispatchEvent(new CustomEvent(RUNTIME_UPDATE_READY_EVENT, {
                                detail: snapshot
                            }))
                            return
                        }

                        sessionStorage.setItem(APP_RECOVERY_KEY, JSON.stringify({
                            reason: 'runtime-asset-reload',
                            at: Date.now()
                        }))
                    } catch (error) {
                        console.error('Failed to clear stale runtime assets', error)
                    } finally {
                        if (sessionStorage.getItem(APP_SHELL_REVEALED_KEY) !== 'done') {
                            window.location.reload()
                        }
                    }
                }

                window.addEventListener('error', function (event) {
                    if (!isLikelyAssetFailure(event)) {
                        return
                    }

                    event.preventDefault()
                    void recoverRuntimeAssets('error:' + normalize(event.message))
                }, true)

                window.addEventListener('unhandledrejection', function (event) {
                    var reason = event.reason
                    var details = {
                        message: normalize(reason && reason.message ? reason.message : String(reason || '')),
                        stack: normalize(reason && reason.stack ? reason.stack : '')
                    }

                    if (!isLikelyAssetFailure(details)) {
                        return
                    }

                    event.preventDefault()
                    void recoverRuntimeAssets('rejection:' + details.message)
                })
            })()
        </script>

        <title>Viby</title>
    </head>
    <body>
        <div id="app-boot-shell" aria-hidden="true">
            <div class="boot-shell-stage">
                <div class="boot-shell-mark-stage" aria-hidden="true">
                    <span class="boot-shell-mark"></span>
                </div>
                <h1 class="boot-shell-title" id="app-boot-shell-title"></h1>
                <div class="boot-shell-rail" aria-hidden="true">
                    <div class="boot-shell-rail-fill"></div>
                </div>
            </div>
        </div>
        <div id="root"></div>
        <script>
            (function () {
                var LOCALE_PREFERENCE_STORAGE_KEY = 'viby-lang-preference'
                var STRINGS = {
                    en: {
                        normal: '',
                        pairing: 'Waking Viby…',
                        recovery: 'Restoring your session…'
                    },
                    'zh-CN': {
                        normal: '',
                        pairing: '叫醒 Viby…',
                        recovery: '正在恢复刚才的会话…'
                    }
                }
                var bootMode = document.documentElement.getAttribute('data-boot-mode')

                function readPreferredLocale() {
                    try {
                        var storedPreference = localStorage.getItem(LOCALE_PREFERENCE_STORAGE_KEY)
                        var rawLocale = storedPreference && storedPreference !== 'system'
                            ? storedPreference
                            : null

                        if (rawLocale === 'zh-CN') {
                            return rawLocale
                        }
                    } catch (error) {
                        // Ignore storage errors.
                    }

                    var browserLanguages = navigator.languages && navigator.languages.length
                        ? navigator.languages
                        : [navigator.language]

                    for (var index = 0; index < browserLanguages.length; index += 1) {
                        var language = String(browserLanguages[index] || '').toLowerCase()
                        if (language.indexOf('zh') === 0) {
                            return 'zh-CN'
                        }
                    }

                    return 'en'
                }

                var locale = readPreferredLocale()
                var mode = bootMode === 'recovery'
                    ? 'recovery'
                    : document.documentElement.getAttribute('data-boot-pairing') === 'true'
                      ? 'pairing'
                      : 'normal'
                var title = document.getElementById('app-boot-shell-title')

                document.documentElement.lang = locale

                if (title) {
                    title.textContent = STRINGS[locale][mode]
                }
            })()
        </script>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
